<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 廣大城租客管理系統</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1><i class="fas fa-sign-in-alt"></i> 登入系統</h1>
                <p id="role-title">租客登入</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> 用戶名稱</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="請輸入用戶名稱">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> 密碼</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="請輸入密碼">
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> 登入
                </button>
            </form>

            <div class="login-footer">
                <p>還沒有帳號？ <a href="register.html">立即註冊</a></p>
                <p><a href="index.html"><i class="fas fa-arrow-left"></i> 返回首頁</a></p>
            </div>
        </div>
    </div>

    <script>
        // 根據 URL 參數顯示不同的登入類型
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'tenant';
        
        document.getElementById('role-title').textContent = 
            role === 'admin' ? '管理員登入' : '租客登入';
        
        // 處理登入表單
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // 這裡呼叫 API 進行登入驗證
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        role
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // 儲存 token 和使用者資訊
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // 根據角色跳轉到不同頁面
                    if (role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'tenant.html';
                    }
                } else {
                    alert('登入失敗：' + data.message);
                }
            } catch (error) {
                console.error('登入錯誤:', error);
                alert('登入時發生錯誤');
            }
        });
    </script>
</body>
</html>
